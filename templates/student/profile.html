{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header">
                    <h4>My Profile</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('student.profile') }}">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" name="department" class="form-control"
                                value="{{ student.department or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">CGPA</label>
                            <input type="text" name="cgpa" class="form-control" value="{{ student.cgpa or '' }}">
                        </div>
                         <div class="mb-3">
                            <label class="form-label">Resume Link (URL)</label>
                            <input type="url" name="resume_link" class="form-control"
                                value="{{ student.resume_link or '' }}"
                                placeholder="https://linkedin.com/in/your-profile">
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                        <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
                       
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
