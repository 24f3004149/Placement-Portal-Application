{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="color: pink;">My Application History</h2>
        <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Company</th>
                <th>Job Title</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for app in applications %}
            <tr>
                <td>{{ app.drive.company.name }}</td>
                <td>{{ app.drive.job_title }}</td>
                <td>
                    <span class="badge 
                        {% if app.status == 'Applied' %}bg-secondary
                        {% elif app.status == 'Shortlisted' %}bg-info
                        {% elif app.status == 'Selected' %}bg-success
                        {% else %}bg-danger{% endif %}">
                        {{ app.status }}
                    </span>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-center">You have not applied to any drives yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
