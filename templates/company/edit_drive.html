<!DOCTYPE html>
<html>
<head>
<title>Edit Placement Drive</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;

    background-image: url("/static/images/company_bg.jpg");
    background-size: cover;
    background-position: center;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background: rgba(255,255,255,0.9);
    padding:40px;
    border-radius:10px;
    width:400px;
    text-align:center;
}

input, textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:5px;
    border:1px solid #ccc;
}

textarea{
    height:80px;
    resize:none;
}

button{
    padding:10px 20px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

</style>

</head>

<body>

<div class="container">

<h2>Edit Placement Drive</h2>

<form method="POST">

<label>Job Title</label>
<input type="text" name="job_title" value="{{ drive.job_title }}" required>

<label>Description</label>
<textarea name="description" required>{{ drive.description }}</textarea>

<label>Package</label>
<input type="text" name="package" value="{{ drive.package }}" required>

<label>Eligibility</label>
<input type="text" name="eligibility" value="{{ drive.eligibility }}" required>

<label>Last Date</label>
<input type="date" name="last_date" value="{{ drive.last_date }}" required>

<br>

<button type="submit">Update Drive</button>

</form>

</div>

</body>
</html>
