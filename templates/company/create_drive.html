{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header"><h4>Create a New Placement Drive</h4></div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('company.create_drive') }}">
                        <div class="mb-3">
                            <label class="form-label">Job Title</label>
                            <input type="text" name="job_title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Job Description</label>
                            <textarea name="description" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Salary (Optional)</label>
                            <input type="number" step="0.01" name="salary" class="form-control">
                        </div>

                        <!-- NEW: Eligibility and Deadline Fields -->
                        <div class="mb-3">
                            <label class="form-label">Eligibility Criteria</label>
                            <textarea name="eligibility_criteria" class="form-control" rows="3" placeholder="e.g., CGPA > 7.0, No backlogs"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Application Deadline</label>
                            <input type="date" name="application_deadline" class="form-control">
                        </div>
                        <!-- END OF NEW FIELDS -->

                        <button type="submit" class="btn btn-primary">Submit for Approval</button>
                        <a href="{{ url_for('company.dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
