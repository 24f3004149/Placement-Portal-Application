{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4>Register</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    
                    <div class="mb-3">
                        <label class="form-label">I am a:</label>
                        <select name="role" class="form-select" required>
                            <option value="student">Student</option>
                            <option value="company">Company</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name / Company Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <!-- Fields for Students -->
                    <div class="mb-3">
                        <label class="form-label">Department (for Students only)</label>
                        <input type="text" name="department" class="form-control" placeholder="e.g., Computer Science">
                    </div>

                    <!-- NEW: Fields for Companies -->
                    <div class="mb-3">
                        <label class="form-label">HR Contact Email (for Companies only)</label>
                        <input type="email" name="hr_contact" class="form-control" placeholder="hr@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Company Website (for Companies only)</label>
                        <input type="url" name="website" class="form-control" placeholder="https://example.com">
                    </div>
                    <!-- END OF NEW FIELDS -->

                    <hr>

                    <!-- Common Fields -->
                    <div class="mb-3">
                        <label class="form-label">Login Email Address</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Register</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <small>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
